<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clothing Store</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mu:#6b6a66;--ac:#0f766e;--bd:#e2e0da;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171716;--card:#222220;--tx:#f0efeb;--mu:#a3a29c;--ac:#2dd4bf;--bd:#38372f}}
:root[data-theme=dark]{--bg:#171716;--card:#222220;--tx:#f0efeb;--mu:#a3a29c;--ac:#2dd4bf;--bd:#38372f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Arial,sans-serif}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:18px;margin:0;flex:1;color:var(--ac)}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 11px}
button{cursor:pointer}button.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}button.on{border-color:var(--ac);color:var(--ac)}
main{max-width:1000px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.img{height:90px;border-radius:8px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;font-size:38px}
.mu{color:var(--mu);font-size:13px}.pr{font-weight:700;font-size:17px}
.sz{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.sz button{padding:3px 10px;font-size:13px}.sz button:disabled{opacity:.35;text-decoration:line-through}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.bar input{flex:1;min-width:140px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.kp b{font-size:22px;display:block}
.low{color:var(--bad);font-weight:700}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:end}form.f label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
#cart{position:fixed;right:0;top:0;bottom:0;width:min(400px,100%);background:var(--bg);border-left:1px solid var(--bd);padding:16px;overflow:auto;transform:translateX(100%);transition:.2s;z-index:9}
#cart.o{transform:none}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;display:none;z-index:20}
h2{font-size:17px;margin:18px 0 8px}
</style></head><body>
<header><h1>👕 Clothing Store</h1>
<button id="t-shop" class="on" onclick="go('shop')">Shop</button>
<button id="t-admin" onclick="go('admin')">Staff</button>
<button class="p" onclick="cartToggle()">Cart (<span id="cc">0</span>)</button></header>
<main id="m"></main><aside id="cart"></aside><div id="toast"></div>
<script>
// Tables follow Inventory.accdb: Clothing, Customers, Employees, Sales. SaleItems is added because Sales has no line items.
const KEY='clothing_store_v1',LOW=5,$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso=n=>'₱'+Number(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
let db,cart=[],view='shop',tab='dash',fCat='',fQ='',user=null;
function seed(){
 const m=[['Classic Tee','Tops','Basic Co','White',399,'👕'],['Graphic Tee','Tops','Urban','Black',549,'👕'],['Pullover Hoodie','Outerwear','Urban','Gray',1299,'🧥'],['Denim Jacket','Outerwear','Denim Lab','Blue',1899,'🧥'],['Slim Jeans','Bottoms','Denim Lab','Blue',1499,'👖'],['Chino Shorts','Bottoms','Basic Co','Khaki',799,'🩳'],['Summer Dress','Dresses','Bloom','Red',1299,'👗']];
 const items=[];let n=0;
 m.forEach(x=>['S','M','L','XL'].forEach((s,i)=>{n++;items.push({ClothingID:n,ItemName:x[0],Category:x[1],Brand:x[2],Size:s,Color:x[3],Price:x[4],StockQuantity:(n*5)%11+(i==1?4:1),Icon:x[5]})}));
 return{clothing:items,customers:[],employees:[{EmployeeID:1,Username:'admin',AccessLevel:'Admin'},{EmployeeID:2,Username:'staff',AccessLevel:'Staff'}],sales:[],items:[]};
}
function load(){try{const s=localStorage.getItem(KEY);db=s?JSON.parse(s):seed()}catch(e){db=seed()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
const it=id=>db.clothing.find(x=>x.ClothingID==id),nid=(a,k)=>a.reduce((m,x)=>Math.max(m,x[k]),0)+1;
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2400)}
function go(v){view=v;$('t-shop').className=v=='shop'?'on':'';$('t-admin').className=v=='admin'?'on':'';$('cart').classList.remove('o');render()}
function render(){$('cc').textContent=cart.reduce((a,c)=>a+c.qty,0);view=='shop'?shop():admin();cartRender()}
const cats=()=>[...new Set(db.clothing.map(x=>x.Category))];
// ---------- shop ----------
function shop(){
 const g={};db.clothing.filter(p=>(!fCat||p.Category==fCat)&&(!fQ||(p.ItemName+p.Brand+p.Color).toLowerCase().includes(fQ.toLowerCase()))).forEach(p=>{(g[p.ItemName+'|'+p.Color+'|'+p.Brand]=g[p.ItemName+'|'+p.Color+'|'+p.Brand]||[]).push(p)});
 const ks=Object.keys(g);
 $('m').innerHTML=`<div class="bar"><input id="q" placeholder="Search clothes, brand, color" value="${esc(fQ)}" oninput="const f=this.value;fQ=f;render();const q=$('q');q.focus();q.setSelectionRange(f.length,f.length)"><select onchange="fCat=this.value;render()"><option value="">All categories</option>${cats().map(c=>`<option ${fCat==c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
 <div class="grid">${ks.length?ks.map(k=>{const a=g[k],p=a[0],t=a.reduce((s,x)=>s+x.StockQuantity,0);
 return`<div class="card"><div class="img" style="background:${esc(p.Color.toLowerCase())};color:#fff;text-shadow:0 0 6px #0008">${p.Icon}</div><b>${esc(p.ItemName)}</b><div class="mu">${esc(p.Brand)} · ${esc(p.Color)} · ${esc(p.Category)}</div><div class="pr">${peso(p.Price)}</div>
 <div class="sz">${a.map(x=>`<button ${x.StockQuantity<1?'disabled':''} onclick="add(${x.ClothingID})" title="${x.StockQuantity} left">${esc(x.Size)}</button>`).join('')}</div><div class="mu">${t>0?'Tap a size to add to cart':'<span class="low">Sold out</span>'}</div></div>`}).join(''):'<p class="mu">No items match your search.</p>'}</div>`}
// ---------- cart ----------
function add(id){const c=cart.find(x=>x.id==id);if((c?c.qty:0)+1>it(id).StockQuantity)return toast('Only '+it(id).StockQuantity+' in stock');c?c.qty++:cart.push({id,qty:1});toast('Added to cart');render()}
function chg(id,d){const c=cart.find(x=>x.id==id);if(d>0&&c.qty+1>it(id).StockQuantity)return toast('No more stock');c.qty+=d;if(c.qty<1)cart=cart.filter(x=>x!=c);render()}
function cartToggle(){$('cart').classList.toggle('o')}
const total=()=>cart.reduce((s,c)=>s+c.qty*it(c.id).Price,0);
function cartRender(){
 let h='<div style="display:flex"><h2 style="flex:1;margin:0">Your cart</h2><button onclick="cartToggle()">Close</button></div>';
 if(!cart.length)h+='<p class="mu">Your cart is empty.</p>';
 else h+=cart.map(c=>{const p=it(c.id);return`<div class="card" style="margin:8px 0"><b>${esc(p.ItemName)}</b> <span class="mu">${esc(p.Color)}, size ${esc(p.Size)}</span><div style="margin-top:6px"><button onclick="chg(${c.id},-1)">−</button> <b>${c.qty}</b> <button onclick="chg(${c.id},1)">+</button> <span style="float:right" class="pr">${peso(c.qty*p.Price)}</span></div></div>`}).join('')+
 `<div class="pr" style="margin:10px 0">Total: ${peso(total())}</div><form class="f" style="grid-template-columns:1fr" onsubmit="event.preventDefault();checkout(this)">
 <label>First name<input name="fn" required></label><label>Last name<input name="ln" required></label><label>Phone<input name="ph" required inputmode="tel"></label><label>Email<input name="em" type="email"></label>
 <label>Delivery address<textarea name="ad" required rows="2"></textarea></label><button class="p">Place order (pay on delivery)</button></form>`;
 $('cart').innerHTML=h}
function checkout(f){
 for(const c of cart)if(c.qty>it(c.id).StockQuantity)return toast('Stock changed for '+it(c.id).ItemName);
 const v=n=>f[n].value.trim();let cu=db.customers.find(x=>x.Phone==v('ph'));
 if(!cu){cu={CustomerID:nid(db.customers,'CustomerID'),FirstName:v('fn'),LastName:v('ln'),Phone:v('ph'),Email:v('em'),Address:v('ad')};db.customers.push(cu)}else{cu.Address=v('ad');cu.Email=v('em')||cu.Email}
 const sid=nid(db.sales,'SaleID');
 db.sales.push({SaleID:sid,CustomerID:cu.CustomerID,EmployeeID:null,SaleDate:today(),TotalAmount:total()});
 cart.forEach(c=>{const p=it(c.id);db.items.push({SaleID:sid,ClothingID:c.id,Quantity:c.qty,UnitPrice:p.Price});p.StockQuantity-=c.qty});
 cart=[];save();cartToggle();toast('Order #'+sid+' placed. Thank you, '+cu.FirstName+'!');render()}
// ---------- staff ----------
function admin(){
 if(!user){$('m').innerHTML=`<h2>Staff sign in</h2><form class="f card" onsubmit="event.preventDefault();signIn(this)"><label>Username (from Employees table)<select name="u">${db.employees.map(e=>`<option>${esc(e.Username)}</option>`).join('')}</select></label><button class="p">Sign in</button></form><p class="mu">The Employees table only has Username and AccessLevel, so there is no password here. Add one before real use.</p>`;return}
 const T=[['dash','Dashboard'],['inv','Items & stock'],['sales','Sales'],['cust','Customers']];if(user.AccessLevel=='Admin')T.push(['emp','Employees']);
 $('m').innerHTML=`<div class="bar">${T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}<button onclick="user=null;render()">Sign out (${esc(user.Username)})</button></div>`+({dash,inv,sales,cust,emp}[tab]||dash)()}
function signIn(f){user=db.employees.find(e=>e.Username==f.u.value);render()}
function dash(){
 const rev=db.sales.reduce((s,x)=>s+x.TotalAmount,0),u=db.items.reduce((s,x)=>s+x.Quantity,0),ts=db.sales.filter(s=>s.SaleDate==today()).reduce((s,x)=>s+x.TotalAmount,0),low=db.clothing.filter(x=>x.StockQuantity<=LOW);
 const b={};db.items.forEach(d=>b[d.ClothingID]=(b[d.ClothingID]||0)+d.Quantity);const top=Object.entries(b).sort((a,c)=>c[1]-a[1]).slice(0,5);
 return`<div class="kp"><div class="card">Total sales<b>${peso(rev)}</b></div><div class="card">Today<b>${peso(ts)}</b></div><div class="card">Orders<b>${db.sales.length}</b></div><div class="card">Units sold<b>${u}</b></div><div class="card">Customers<b>${db.customers.length}</b></div></div>
 <h2>Low stock (${LOW} or fewer) — ${low.length}</h2><div class="tw card"><table><tr><th>Item</th><th>Size</th><th>Color</th><th>Left</th></tr>${low.map(x=>`<tr><td>${esc(x.ItemName)}</td><td>${esc(x.Size)}</td><td>${esc(x.Color)}</td><td class="low">${x.StockQuantity}</td></tr>`).join('')||'<tr><td colspan=4>All good</td></tr>'}</table></div>
 <h2>Best sellers</h2><div class="tw card"><table>${top.map(([i,q])=>`<tr><td>${esc(it(i).ItemName)} (${esc(it(i).Size)})</td><td>${q} sold</td></tr>`).join('')||'<tr><td>No sales yet. Place an order in the shop.</td></tr>'}</table></div>`}
function inv(){
 return`<h2>Add item</h2><form class="f card" onsubmit="event.preventDefault();addItem(this)"><label>Item name<input name="n" required></label><label>Category<input name="c" list="cl" required><datalist id="cl">${cats().map(c=>`<option>${esc(c)}`).join('')}</datalist></label><label>Brand<input name="b" required></label>
 <label>Size<input name="s" required></label><label>Color<input name="k" required></label><label>Price<input name="p" type="number" min="0" step="0.01" required></label><label>Stock<input name="q" type="number" min="0" value="0" required></label><button class="p">Save item</button></form>
 <h2>Items (${db.clothing.length})</h2><div class="tw card"><table><tr><th>ID</th><th>Item</th><th>Category</th><th>Brand</th><th>Size</th><th>Color</th><th>Price</th><th>Stock</th><th>Restock</th></tr>${db.clothing.map(x=>`<tr><td>${x.ClothingID}</td><td>${esc(x.ItemName)}</td><td>${esc(x.Category)}</td><td>${esc(x.Brand)}</td><td>${esc(x.Size)}</td><td>${esc(x.Color)}</td><td>${peso(x.Price)}</td><td class="${x.StockQuantity<=LOW?'low':''}">${x.StockQuantity}</td><td><button onclick="rs(${x.ClothingID},10)">+10</button> <button onclick="rs(${x.ClothingID},-1)">−1</button></td></tr>`).join('')}</table></div>`}
function addItem(f){const id=nid(db.clothing,'ClothingID');db.clothing.push({ClothingID:id,ItemName:f.n.value.trim(),Category:f.c.value.trim(),Brand:f.b.value.trim(),Size:f.s.value.trim(),Color:f.k.value.trim(),Price:+f.p.value,StockQuantity:+f.q.value,Icon:'👕'});save();toast('Item saved');render()}
function rs(id,d){const x=it(id);if(x.StockQuantity+d<0)return toast('Stock cannot go below zero');x.StockQuantity+=d;save();render()}
function sales(){
 if(!db.sales.length)return'<p class="mu">No orders yet.</p>';
 return'<h2>Orders</h2>'+db.sales.slice().reverse().map(s=>{const c=db.customers.find(x=>x.CustomerID==s.CustomerID);
 return`<details class="card" style="margin-bottom:8px"><summary><b>Order #${s.SaleID}</b> · ${s.SaleDate} · ${esc(c.FirstName+' '+c.LastName)} · ${peso(s.TotalAmount)}</summary><p class="mu">${esc(c.Phone)} · ${esc(c.Email||'no email')} · ${esc(c.Address)}</p><div class="tw"><table>${db.items.filter(d=>d.SaleID==s.SaleID).map(d=>`<tr><td>${esc(it(d.ClothingID).ItemName)} (${esc(it(d.ClothingID).Size)})</td><td>${d.Quantity} × ${peso(d.UnitPrice)}</td></tr>`).join('')}</table></div></details>`}).join('')}
function cust(){return`<h2>Customers (${db.customers.length})</h2><div class="tw card"><table><tr><th>ID</th><th>Name</th><th>Phone</th><th>Email</th><th>Address</th></tr>${db.customers.map(c=>`<tr><td>${c.CustomerID}</td><td>${esc(c.FirstName+' '+c.LastName)}</td><td>${esc(c.Phone)}</td><td>${esc(c.Email)}</td><td>${esc(c.Address)}</td></tr>`).join('')||'<tr><td>None yet</td></tr>'}</table></div>`}
function emp(){return`<h2>Employees</h2><div class="tw card"><table><tr><th>ID</th><th>Username</th><th>AccessLevel</th></tr>${db.employees.map(e=>`<tr><td>${e.EmployeeID}</td><td>${esc(e.Username)}</td><td>${esc(e.AccessLevel)}</td></tr>`).join('')}</table></div><p><button onclick="if(confirm('Reset all demo data?')){localStorage.removeItem(KEY);load();cart=[];user=null;render()}">Reset demo data</button></p>`}
load();render();
</script></body></html>
