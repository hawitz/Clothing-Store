<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Threads & Co. · Clothing Store</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --card: #fff;
      --tx: #1d1d1b;
      --mu: #6b6a66;
      --ac: #0f766e;
      --ac2: #14b8a6;
      --bd: #e2e0da;
      --bad: #b91c1c;
      --radius: 18px;
      --shadow: 0 10px 25px -8px rgba(0,0,0,0.06);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme=light]) {
        --bg: #171716;
        --card: #222220;
        --tx: #f0efeb;
        --mu: #a3a29c;
        --ac: #2dd4bf;
        --ac2: #5eead4;
        --bd: #38372f;
        --shadow: 0 10px 25px -8px rgba(0,0,0,0.4);
      }
    }
    :root[data-theme=dark] {
      --bg: #171716;
      --card: #222220;
      --tx: #f0efeb;
      --mu: #a3a29c;
      --ac: #2dd4bf;
      --ac2: #5eead4;
      --bd: #38372f;
      --shadow: 0 10px 25px -8px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* header */
    header {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      padding: 12px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--bd);
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 20;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }
    header h1 {
      font-size: 20px;
      margin: 0;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--ac);
      letter-spacing: -0.3px;
    }
    header h1 span { font-size: 26px; }
    button, select, input, textarea {
      font: inherit;
      color: var(--tx);
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 8px 15px;
      transition: 0.15s ease;
      outline: none;
    }
    button { cursor: pointer; font-weight: 500; }
    button.p {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac);
    }
    button.p:hover { background: var(--ac2); border-color: var(--ac2); }
    button.on {
      border-color: var(--ac);
      color: var(--ac);
      background: rgba(15, 118, 110, 0.08);
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; text-decoration: line-through; }
    /* main */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 40px;
      width: 100%;
      flex: 1;
    }
    /* welcome page */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      text-align: center;
      gap: 28px;
    }
    .hero h2 {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -1px;
      color: var(--ac);
      margin-bottom: 6px;
    }
    .hero p {
      font-size: 18px;
      color: var(--mu);
      max-width: 500px;
    }
    .role-cards {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
    }
    .role-card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 28px;
      padding: 36px 30px;
      width: 260px;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .role-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 30px -12px rgba(0,0,0,0.15);
    }
    .role-card .emoji { font-size: 56px; line-height: 1; }
    .role-card h3 { font-size: 22px; margin: 4px 0; color: var(--ac); }
    .role-card p { font-size: 14px; color: var(--mu); }
    .role-card button { width: 100%; margin-top: 8px; }
    /* grid & cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      transition: 0.15s;
      display: flex;
      flex-direction: column;
    }
    .card:hover { border-color: var(--ac); }
    .img {
      height: 110px;
      border-radius: 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      background-size: cover;
      background-position: center;
      color: #fff;
      text-shadow: 0 0 12px rgba(0,0,0,0.5);
    }
    .mu { color: var(--mu); font-size: 13px; }
    .pr { font-weight: 700; font-size: 19px; margin: 6px 0; }
    .sz { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .sz button { padding: 4px 12px; font-size: 13px; border-radius: 20px; }
    .sz button:disabled { opacity: 0.3; text-decoration: line-through; }
    .bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      align-items: center;
    }
    .bar input { flex: 1; min-width: 160px; }
    .tw { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--bd); white-space: nowrap; }
    th { color: var(--mu); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; }
    .kp {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }
    .kp .card b { font-size: 26px; display: block; margin-top: 4px; color: var(--ac); }
    .low { color: var(--bad); font-weight: 700; }
    form.f {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      align-items: end;
      background: var(--card);
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--bd);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    form.f label {
      font-size: 12px;
      color: var(--mu);
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-weight: 500;
    }
    form.f input, form.f select, form.f textarea { width: 100%; }
    /* cart */
    #cart {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      width: min(420px, 100%);
      background: var(--bg);
      border-left: 1px solid var(--bd);
      padding: 22px;
      overflow: auto;
      transform: translateX(100%);
      transition: 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
      z-index: 50;
      box-shadow: -12px 0 30px rgba(0,0,0,0.1);
    }
    #cart.o { transform: none; }
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--tx);
      color: var(--bg);
      padding: 12px 24px;
      border-radius: 40px;
      display: none;
      z-index: 100;
      font-weight: 500;
      box-shadow: 0 12px 28px rgba(0,0,0,0.2);
    }
    h2 { font-size: 20px; margin: 24px 0 12px; letter-spacing: -0.2px; }
    h2:first-of-type { margin-top: 4px; }
    .badge {
      display: inline-block;
      background: var(--ac);
      color: #fff;
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 30px;
      margin-left: 8px;
    }
    /* order details */
    details.card { padding: 16px; margin-bottom: 10px; }
    details.card summary { cursor: pointer; font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    details.card summary::-webkit-details-marker { display: none; }
    details.card summary::before { content: "▸"; transition: 0.2s; display: inline-block; }
    details.card[open] summary::before { transform: rotate(90deg); }
    .remove-btn { color: var(--bad); border-color: var(--bd); }
    .remove-btn:hover { background: #fee2e2; border-color: var(--bad); }
    @media (max-width: 600px) {
      .hero h2 { font-size: 32px; }
      .role-card { width: 100%; max-width: 300px; }
    }
  </style>
</head>
<body>
  <header>
    <h1><span>🧵</span> Threads & Co.</h1>
    <button id="t-home" class="on" onclick="go('home')">Home</button>
    <button id="t-shop" onclick="go('shop')">Shop</button>
    <button id="t-admin" onclick="go('admin')">Staff</button>
    <button class="p" onclick="cartToggle()">Cart (<span id="cc">0</span>)</button>
  </header>
  <main id="m"></main>
  <aside id="cart"></aside>
  <div id="toast"></div>

  <script>
    // ─── Data & helpers ──────────────────────────────────────────
    const KEY = 'clothing_store_v2', LOW = 5, $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const peso = n => '₱' + Number(n).toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});
    const today = () => new Date().toISOString().slice(0,10);

    // richer seed with images (icons and gradient backgrounds)
    function seed() {
      const models = [
        { name:'Classic Tee', cat:'Tops', brand:'Basic Co', color:'White', price:399, icon:'👕', bg:'linear-gradient(135deg,#f0f0f0,#d4d4d4)' },
        { name:'Graphic Tee', cat:'Tops', brand:'Urban', color:'Black', price:549, icon:'👕', bg:'linear-gradient(135deg,#2d2d2d,#4a4a4a)' },
        { name:'Pullover Hoodie', cat:'Outerwear', brand:'Urban', color:'Gray', price:1299, icon:'🧥', bg:'linear-gradient(135deg,#9ca3af,#6b7280)' },
        { name:'Denim Jacket', cat:'Outerwear', brand:'Denim Lab', color:'Blue', price:1899, icon:'🧥', bg:'linear-gradient(135deg,#3b82f6,#1e3a8a)' },
        { name:'Slim Jeans', cat:'Bottoms', brand:'Denim Lab', color:'Blue', price:1499, icon:'👖', bg:'linear-gradient(135deg,#2563eb,#1e40af)' },
        { name:'Chino Shorts', cat:'Bottoms', brand:'Basic Co', color:'Khaki', price:799, icon:'🩳', bg:'linear-gradient(135deg,#d4a373,#b5835a)' },
        { name:'Summer Dress', cat:'Dresses', brand:'Bloom', color:'Red', price:1299, icon:'👗', bg:'linear-gradient(135deg,#ef4444,#b91c1c)' },
        { name:'Linen Shirt', cat:'Tops', brand:'Coast', color:'Beige', price:899, icon:'👔', bg:'linear-gradient(135deg,#e7e5e4,#d6d3d1)' },
      ];
      const items = [];
      let id = 0;
      models.forEach(m => {
        ['S','M','L','XL'].forEach((size, idx) => {
          id++;
          // ensure stock is above 10, but varies
          const stock = 12 + (id % 9) + (idx === 1 ? 4 : 0);
          items.push({
            ClothingID: id,
            ItemName: m.name,
            Category: m.cat,
            Brand: m.brand,
            Size: size,
            Color: m.color,
            Price: m.price,
            StockQuantity: stock,
            Icon: m.icon,
            Bg: m.bg,
          });
        });
      });
      return {
        clothing: items,
        customers: [],
        employees: [
          { EmployeeID: 1, Username: 'admin', AccessLevel: 'Admin' },
          { EmployeeID: 2, Username: 'staff', AccessLevel: 'Staff' }
        ],
        sales: [],
        items: [],
      };
    }

    let db, cart = [], view = 'home', tab = 'dash', fCat = '', fQ = '', user = null;

    function load() {
      try {
        const s = localStorage.getItem(KEY);
        db = s ? JSON.parse(s) : seed();
        // ensure demo stock stays above 10 if older data loaded
        if (db.clothing) db.clothing.forEach(c => { if (c.StockQuantity < 10) c.StockQuantity = 12 + (c.ClothingID % 7); });
      } catch (e) { db = seed(); }
    }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
    const it = id => db.clothing.find(x => x.ClothingID == id);
    const nid = (arr, k) => arr.reduce((m, x) => Math.max(m, x[k]), 0) + 1;

    function toast(t) {
      const e = $('toast');
      e.textContent = t;
      e.style.display = 'block';
      setTimeout(() => e.style.display = 'none', 2400);
    }

    // ─── navigation ──────────────────────────────────────────────
    function go(v) {
      view = v;
      $('t-home').className = v === 'home' ? 'on' : '';
      $('t-shop').className = v === 'shop' ? 'on' : '';
      $('t-admin').className = v === 'admin' ? 'on' : '';
      $('cart').classList.remove('o');
      render();
    }

    // ─── render ──────────────────────────────────────────────────
    function render() {
      $('cc').textContent = cart.reduce((a, c) => a + c.qty, 0);
      if (view === 'home') home();
      else if (view === 'shop') shop();
      else if (view === 'admin') admin();
      cartRender();
    }

    // ─── HOME PAGE ──────────────────────────────────────────────
    function home() {
      $('m').innerHTML = `
        <div class="hero">
          <div>
            <h2>Welcome to Threads & Co.</h2>
            <p>Your everyday clothing store — browse, order, and manage with ease.</p>
          </div>
          <div class="role-cards">
            <div class="role-card" onclick="go('shop')">
              <div class="emoji">🛍️</div>
              <h3>Customer</h3>
              <p>Browse the collection, add to cart, and place orders.</p>
              <button class="p" style="width:100%">Start shopping</button>
            </div>
            <div class="role-card" onclick="go('admin')">
              <div class="emoji">📋</div>
              <h3>Staff / Admin</h3>
              <p>Manage inventory, view sales, customers, and employees.</p>
              <button style="width:100%">Staff sign in</button>
            </div>
          </div>
        </div>`;
    }

    // ─── SHOP ────────────────────────────────────────────────────
    function shop() {
      const groups = {};
      db.clothing
        .filter(p => (!fCat || p.Category === fCat) && (!fQ || (p.ItemName + p.Brand + p.Color).toLowerCase().includes(fQ.toLowerCase())))
        .forEach(p => {
          const key = p.ItemName + '|' + p.Color + '|' + p.Brand;
          (groups[key] = groups[key] || []).push(p);
        });
      const keys = Object.keys(groups);
      $('m').innerHTML = `
        <div class="bar">
          <input id="q" placeholder="🔍 Search clothes, brand, color" value="${esc(fQ)}"
            oninput="const f=this.value;fQ=f;render();const q=$('q');q.focus();q.setSelectionRange(f.length,f.length)">
          <select onchange="fCat=this.value;render()">
            <option value="">All categories</option>
            ${cats().map(c => `<option ${fCat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
          </select>
        </div>
        <div class="grid">
          ${keys.length ? keys.map(k => {
            const a = groups[k], p = a[0], totalStock = a.reduce((s, x) => s + x.StockQuantity, 0);
            return `<div class="card">
              <div class="img" style="background: ${p.Bg || p.Color.toLowerCase()}; color:#fff; text-shadow:0 0 12px #0008">
                ${p.Icon || '👕'}
              </div>
              <b>${esc(p.ItemName)}</b>
              <div class="mu">${esc(p.Brand)} · ${esc(p.Color)} · ${esc(p.Category)}</div>
              <div class="pr">${peso(p.Price)}</div>
              <div class="sz">
                ${a.map(x => `<button ${x.StockQuantity < 1 ? 'disabled' : ''} onclick="add(${x.ClothingID})" title="${x.StockQuantity} left">${esc(x.Size)}</button>`).join('')}
              </div>
              <div class="mu">${totalStock > 0 ? 'Tap a size to add' : '<span class="low">Sold out</span>'}</div>
            </div>`;
          }).join('') : '<p class="mu" style="grid-column:1/-1;">No items match your search.</p>'}
        </div>`;
    }

    // ─── CART ────────────────────────────────────────────────────
    function add(id) {
      const item = it(id);
      const existing = cart.find(x => x.id == id);
      const qty = existing ? existing.qty : 0;
      if (qty + 1 > item.StockQuantity) return toast('Only ' + item.StockQuantity + ' in stock');
      existing ? existing.qty++ : cart.push({ id, qty: 1 });
      toast('Added to cart');
      render();
    }
    function chg(id, delta) {
      const c = cart.find(x => x.id == id);
      const item = it(id);
      if (delta > 0 && c.qty + 1 > item.StockQuantity) return toast('No more stock');
      c.qty += delta;
      if (c.qty < 1) cart = cart.filter(x => x != c);
      render();
    }
    function cartToggle() { $('cart').classList.toggle('o'); }
    const total = () => cart.reduce((s, c) => s + c.qty * it(c.id).Price, 0);

    function cartRender() {
      let h = '<div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;"><h2 style="flex:1;margin:0;">🛒 Your cart</h2><button onclick="cartToggle()">✕</button></div>';
      if (!cart.length) h += '<p class="mu" style="padding:20px 0;">Your cart is empty.</p>';
      else {
        h += cart.map(c => {
          const p = it(c.id);
          return `<div class="card" style="margin:8px 0; padding:12px;">
            <div style="display:flex; gap:10px; align-items:center;">
              <div style="font-size:28px; background:${p.Bg || '#ddd'}; width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;">${p.Icon || '👕'}</div>
              <div style="flex:1;">
                <b>${esc(p.ItemName)}</b><br>
                <span class="mu">${esc(p.Color)}, size ${esc(p.Size)}</span>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:6px; margin-top:10px;">
              <button onclick="chg(${c.id},-1)">−</button>
              <b style="min-width:28px; text-align:center;">${c.qty}</b>
              <button onclick="chg(${c.id},1)">+</button>
              <span style="margin-left:auto; font-weight:700;">${peso(c.qty * p.Price)}</span>
              <button class="remove-btn" style="padding:4px 10px; font-size:13px;" onclick="removeFromCart(${c.id})">🗑️</button>
            </div>
          </div>`;
        }).join('');
        h += `<div class="pr" style="margin:14px 0; font-size:20px;">Total: ${peso(total())}</div>
          <form class="f" style="grid-template-columns:1fr; padding:16px;" onsubmit="event.preventDefault();checkout(this)">
            <label>First name<input name="fn" required></label>
            <label>Last name<input name="ln" required></label>
            <label>Phone<input name="ph" required inputmode="tel"></label>
            <label>Email<input name="em" type="email"></label>
            <label>Delivery address<textarea name="ad" required rows="2"></textarea></label>
            <button class="p" style="font-size:16px; padding:12px;">Place order · pay on delivery</button>
          </form>`;
      }
      $('cart').innerHTML = h;
    }

    // new function to remove order line (customer can remove item from cart)
    function removeFromCart(id) {
      cart = cart.filter(c => c.id != id);
      render();
      toast('Item removed from cart');
    }

    function checkout(f) {
      for (const c of cart) if (c.qty > it(c.id).StockQuantity) return toast('Stock changed for ' + it(c.id).ItemName);
      const v = n => f[n].value.trim();
      let cu = db.customers.find(x => x.Phone == v('ph'));
      if (!cu) {
        cu = { CustomerID: nid(db.customers, 'CustomerID'), FirstName: v('fn'), LastName: v('ln'), Phone: v('ph'), Email: v('em'), Address: v('ad') };
        db.customers.push(cu);
      } else { cu.Address = v('ad'); cu.Email = v('em') || cu.Email; }
      const sid = nid(db.sales, 'SaleID');
      db.sales.push({ SaleID: sid, CustomerID: cu.CustomerID, EmployeeID: null, SaleDate: today(), TotalAmount: total() });
      cart.forEach(c => {
        const p = it(c.id);
        db.items.push({ SaleID: sid, ClothingID: c.id, Quantity: c.qty, UnitPrice: p.Price });
        p.StockQuantity -= c.qty;
      });
      cart = [];
      save();
      cartToggle();
      toast('Order #' + sid + ' placed. Thank you, ' + cu.FirstName + '!');
      render();
    }

    // ─── STAFF / ADMIN ──────────────────────────────────────────
    function admin() {
      if (!user) {
        $('m').innerHTML = `
          <h2>Staff sign in</h2>
          <form class="f card" onsubmit="event.preventDefault();signIn(this)" style="max-width:400px;">
            <label>Username (from Employees table)
              <select name="u">${db.employees.map(e => `<option>${esc(e.Username)}</option>`).join('')}</select>
            </label>
            <button class="p">Sign in</button>
          </form>
          <p class="mu" style="margin-top:12px;">Demo: no password required. Add authentication for production.</p>`;
        return;
      }
      const T = [['dash', 'Dashboard'], ['inv', 'Items & stock'], ['sales', 'Orders'], ['cust', 'Customers']];
      if (user.AccessLevel == 'Admin') T.push(['emp', 'Employees']);
      $('m').innerHTML = `
        <div class="bar">
          ${T.map(t => `<button class="${tab === t[0] ? 'on' : ''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}
          <button onclick="user=null;render()">Sign out (${esc(user.Username)})</button>
        </div>
        ${({dash, inv, sales, cust, emp}[tab] || dash)()}`;
    }
    function signIn(f) { user = db.employees.find(e => e.Username == f.u.value); render(); }

    function dash() {
      const rev = db.sales.reduce((s, x) => s + x.TotalAmount, 0);
      const units = db.items.reduce((s, x) => s + x.Quantity, 0);
      const todaySales = db.sales.filter(s => s.SaleDate == today()).reduce((s, x) => s + x.TotalAmount, 0);
      const low = db.clothing.filter(x => x.StockQuantity <= LOW);
      const best = {};
      db.items.forEach(d => best[d.ClothingID] = (best[d.ClothingID] || 0) + d.Quantity);
      const top = Object.entries(best).sort((a, c) => c[1] - a[1]).slice(0, 5);
      return `
        <div class="kp">
          <div class="card">Total sales<b>${peso(rev)}</b></div>
          <div class="card">Today<b>${peso(todaySales)}</b></div>
          <div class="card">Orders<b>${db.sales.length}</b></div>
          <div class="card">Units sold<b>${units}</b></div>
          <div class="card">Customers<b>${db.customers.length}</b></div>
        </div>
        <h2>⚠️ Low stock (${LOW} or fewer) — ${low.length}</h2>
        <div class="tw card" style="padding:0; overflow:hidden;">
          <table>
            <tr><th>Item</th><th>Size</th><th>Color</th><th>Left</th></tr>
            ${low.map(x => `<tr><td>${esc(x.ItemName)}</td><td>${esc(x.Size)}</td><td>${esc(x.Color)}</td><td class="low">${x.StockQuantity}</td></tr>`).join('') || '<tr><td colspan=4 style="padding:16px;">All good ✅</td></tr>'}
          </table>
        </div>
        <h2>🔥 Best sellers</h2>
        <div class="tw card" style="padding:0; overflow:hidden;">
          <table>
            ${top.map(([i, q]) => `<tr><td>${esc(it(i).ItemName)} (${esc(it(i).Size)})</td><td>${q} sold</td></tr>`).join('') || '<tr><td style="padding:16px;">No sales yet. Place an order in the shop.</td></tr>'}
          </table>
        </div>`;
    }

    function inv() {
      return `
        <h2>➕ Add item</h2>
        <form class="f" onsubmit="event.preventDefault();addItem(this)">
          <label>Item name<input name="n" required></label>
          <label>Category<input name="c" list="cl" required><datalist id="cl">${cats().map(c => `<option>${esc(c)}`).join('')}</datalist></label>
          <label>Brand<input name="b" required></label>
          <label>Size<input name="s" required></label>
          <label>Color<input name="k" required></label>
          <label>Price<input name="p" type="number" min="0" step="0.01" required></label>
          <label>Stock<input name="q" type="number" min="0" value="12" required></label>
          <button class="p">Save item</button>
        </form>
        <h2>📦 Items (${db.clothing.length})</h2>
        <div class="tw card" style="padding:0; overflow:hidden;">
          <table>
            <tr><th>ID</th><th>Item</th><th>Category</th><th>Brand</th><th>Size</th><th>Color</th><th>Price</th><th>Stock</th><th>Restock</th></tr>
            ${db.clothing.map(x => `<tr>
              <td>${x.ClothingID}</td>
              <td>${esc(x.ItemName)}</td>
              <td>${esc(x.Category)}</td>
              <td>${esc(x.Brand)}</td>
              <td>${esc(x.Size)}</td>
              <td>${esc(x.Color)}</td>
              <td>${peso(x.Price)}</td>
              <td class="${x.StockQuantity <= LOW ? 'low' : ''}">${x.StockQuantity}</td>
              <td><button onclick="rs(${x.ClothingID},10)">+10</button> <button onclick="rs(${x.ClothingID},-1)">−1</button></td>
            </tr>`).join('')}
          </table>
        </div>`;
    }
    function addItem(f) {
      const id = nid(db.clothing, 'ClothingID');
      db.clothing.push({
        ClothingID: id,
        ItemName: f.n.value.trim(),
        Category: f.c.value.trim(),
        Brand: f.b.value.trim(),
        Size: f.s.value.trim(),
        Color: f.k.value.trim(),
        Price: +f.p.value,
        StockQuantity: +f.q.value,
        Icon: '👕',
        Bg: 'linear-gradient(135deg,#e5e5e5,#cccccc)'
      });
      save(); toast('Item saved'); render();
    }
    function rs(id, d) {
      const x = it(id);
      if (x.StockQuantity + d < 0) return toast('Stock cannot go below zero');
      x.StockQuantity += d;
      save(); render();
    }

    // ─── SALES with remove order feature (staff) ─────────────────
    function sales() {
      if (!db.sales.length) return '<p class="mu">No orders yet.</p>';
      return '<h2>🧾 Orders</h2>' + db.sales.slice().reverse().map(s => {
        const c = db.customers.find(x => x.CustomerID == s.CustomerID);
        return `<details class="card" style="margin-bottom:10px;">
          <summary>
            <b>Order #${s.SaleID}</b> · ${s.SaleDate} · ${esc(c.FirstName + ' ' + c.LastName)} · ${peso(s.TotalAmount)}
            <button class="remove-btn" style="margin-left:auto; padding:4px 12px; font-size:13px;" onclick="event.stopPropagation(); removeOrder(${s.SaleID})">🗑️ Remove order</button>
          </summary>
          <p class="mu" style="margin-top:10px;">${esc(c.Phone)} · ${esc(c.Email || 'no email')} · ${esc(c.Address)}</p>
          <div class="tw">
            <table>
              ${db.items.filter(d => d.SaleID == s.SaleID).map(d => `<tr><td>${esc(it(d.ClothingID).ItemName)} (${esc(it(d.ClothingID).Size)})</td><td>${d.Quantity} × ${peso(d.UnitPrice)}</td></tr>`).join('')}
            </table>
          </div>
        </details>`;
      }).join('');
    }

    // remove order (staff only) + restock
    function removeOrder(saleId) {
      if (!confirm('Remove this order permanently? Stock will be restored.')) return;
      const sale = db.sales.find(s => s.SaleID == saleId);
      if (!sale) return;
      // restock items from this order
      const saleItems = db.items.filter(i => i.SaleID == saleId);
      saleItems.forEach(si => {
        const p = it(si.ClothingID);
        if (p) p.StockQuantity += si.Quantity;
      });
      // remove sale and its line items
      db.sales = db.sales.filter(s => s.SaleID != saleId);
      db.items = db.items.filter(i => i.SaleID != saleId);
      save();
      toast('Order #' + saleId + ' removed and stock restored');
      render();
    }

    function cust() {
      return `<h2>👥 Customers (${db.customers.length})</h2>
        <div class="tw card" style="padding:0; overflow:hidden;">
          <table>
            <tr><th>ID</th><th>Name</th><th>Phone</th><th>Email</th><th>Address</th></tr>
            ${db.customers.map(c => `<tr><td>${c.CustomerID}</td><td>${esc(c.FirstName + ' ' + c.LastName)}</td><td>${esc(c.Phone)}</td><td>${esc(c.Email)}</td><td>${esc(c.Address)}</td></tr>`).join('') || '<tr><td colspan="5" style="padding:16px;">None yet</td></tr>'}
          </table>
        </div>`;
    }

    function emp() {
      return `<h2>🧑‍💼 Employees</h2>
        <div class="tw card" style="padding:0; overflow:hidden;">
          <table>
            <tr><th>ID</th><th>Username</th><th>AccessLevel</th></tr>
            ${db.employees.map(e => `<tr><td>${e.EmployeeID}</td><td>${esc(e.Username)}</td><td>${esc(e.AccessLevel)}</td></tr>`).join('')}
          </table>
        </div>
        <p style="margin-top:20px;"><button onclick="if(confirm('Reset all demo data?')){localStorage.removeItem(KEY);load();cart=[];user=null;render()}">🔄 Reset demo data</button></p>`;
    }

    const cats = () => [...new Set(db.clothing.map(x => x.Category))];

    // ─── start ──────────────────────────────────────────────────
    load();
    render();
  </script>
</body>
</html>
